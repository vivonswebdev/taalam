<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔄 Mise à jour Ta'alam</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1a6b3c, #2d8659);
      color: white;
    }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { font-size: 1rem; opacity: 0.9; margin-bottom: 2rem; }
    .loader {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back-link {
      display: inline-block; margin-top: 1.5rem;
      color: rgba(255,255,255,0.8); text-decoration: underline;
      font-size: 0.9rem;
    }
    .back-link:hover { color: white; }
    .steps { text-align: left; font-size: 0.85rem; opacity: 0.85; margin-top: 1rem; }
    .steps li { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader" id="loader"></div>
    <h1>🔄 Mise à jour en cours</h1>
    <p id="status">Suppression du cache…</p>
    <ol class="steps" id="steps">
      <li id="s1">⏳ Suppression des caches…</li>
      <li id="s2">⏳ Désinscription Service Workers…</li>
      <li id="s3">⏳ Nettoyage localStorage…</li>
      <li id="s4">⏳ Redirection…</li>
    </ol>
    <a href="/" class="back-link">← Retour à l'app</a>
  </div>
  <script>
    (async () => {
      function done(id) { document.getElementById(id).textContent = document.getElementById(id).textContent.replace('⏳', '✅'); }
      try {
        // 1. Clear all caches
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(n => caches.delete(n)));
        }
        done('s1');

        // 2. Unregister all service workers
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        done('s2');

        // 3. Preserve auth tokens, clear rest
        const authKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('sb-')) authKeys.push([key, localStorage.getItem(key)]);
        }
        localStorage.clear();
        authKeys.forEach(([k, v]) => { if (v) localStorage.setItem(k, v); });
        done('s3');

        // 4. Redirect
        document.getElementById('status').textContent = '✅ Terminé ! Redirection…';
        done('s4');
        setTimeout(() => { window.location.href = '/?v=' + Date.now(); }, 1000);
      } catch (e) {
        document.getElementById('status').textContent = '❌ Erreur — cliquez sur le lien ci-dessous';
        document.getElementById('loader').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
